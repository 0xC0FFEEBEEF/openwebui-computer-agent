<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Sandbox</title>
<style>
  :root { --bg:#0d0d0d; --fg:#e8e8e8; --dim:#8a8a8a; --line:#262626; --accent:#4f8cff; --warn:#f5a524; }
  html, body { margin:0; background:transparent; color:var(--fg);
    font:13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .frame { background:var(--bg); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:10px; padding:8px 10px 8px 12px; border-bottom:1px solid var(--line); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.busy { background:var(--accent); animation:pulse 1.2s ease-in-out infinite; }
  .dot.user { background:var(--warn); }
  .dot.off { background:#e5484d; }
  @keyframes pulse { 50% { opacity:.35 } }
  .caption { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); }
  .caption b { color:var(--fg); font-weight:600; }
  button { font:inherit; color:var(--fg); background:#1c1c1c; border:1px solid #333; border-radius:8px;
    padding:4px 10px; cursor:pointer; white-space:nowrap; }
  button:hover { background:#262626; }
  button.primary { background:var(--warn); color:#111; border-color:var(--warn); font-weight:600; }
  .screen { position:relative; width:100%; aspect-ratio:16/10; background:#000; }
  #vnc { position:absolute; inset:0; }
  #vnc canvas { cursor:default; }
  .screen.locked #vnc { pointer-events:none; }
  #ptr { position:absolute; left:0; top:0; width:22px; height:22px; pointer-events:none;
    transform:translate(-3px,-2px); filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); z-index:3; }
  #ptr.hide { display:none; }
  .ripple { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%;
    border:2px solid var(--accent); pointer-events:none; z-index:2; animation:rip .55s ease-out forwards; }
  @keyframes rip { from { transform:scale(.3); opacity:1 } to { transform:scale(1.4); opacity:0 } }
  .toast { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); max-width:80%;
    background:rgba(20,20,20,.88); border:1px solid #333; border-radius:8px; padding:4px 10px;
    color:var(--fg); font:12px ui-monospace, monospace; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; opacity:0; transition:opacity .2s; z-index:4; pointer-events:none; }
  .toast.show { opacity:1; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); z-index:1; }
  /* ---- plan / todo panel ---- */
  :root { --done:#3fb950; }
  .todo { border-top:1px solid var(--line); padding:10px 14px 12px; overflow:hidden;
    transition:max-height .45s ease, padding .45s ease, opacity .3s; max-height:600px; }
  .todo.empty { max-height:0; padding-top:0; padding-bottom:0; opacity:0; border-top-color:transparent; }
  .todo-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; color:var(--dim);
    font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
  .todo-head .count { margin-left:auto; text-transform:none; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .progress { height:3px; background:#1f1f1f; border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .progress > i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--done));
    border-radius:3px; transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .todo ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .todo li { display:flex; align-items:flex-start; gap:10px; line-height:1.35;
    animation:slidein .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes slidein { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:none } }
  .todo .mark { position:relative; flex:none; width:16px; height:16px; margin-top:1px; }
  .todo .mark svg { position:absolute; inset:0; width:16px; height:16px; overflow:visible; }
  .todo .ring { fill:none; stroke:#444; stroke-width:1.6; transition:stroke .3s, fill .3s; }
  .todo .spin { fill:none; stroke:var(--accent); stroke-width:1.8; stroke-linecap:round;
    stroke-dasharray:12 40; opacity:0; transform-origin:8px 8px; transition:opacity .3s; }
  .todo .tick { fill:none; stroke:#0d0d0d; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:12; stroke-dashoffset:12; transition:stroke-dashoffset .35s ease .15s; }
  .todo .label { position:relative; color:var(--dim); transition:color .3s; }
  .todo .label::after { content:""; position:absolute; left:0; top:52%; height:1px; width:0;
    background:currentColor; transition:width .4s ease .2s; }
  .todo li.active .label { color:var(--fg); }
  .todo li.active .ring { stroke:#2a3a55; }
  .todo li.active .spin { opacity:1; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg) } }
  .todo li.done .ring { stroke:var(--done); fill:var(--done); }
  .todo li.done .tick { stroke-dashoffset:0; }
  .todo li.done .label { color:#6b6b6b; }
  .todo li.done .label::after { width:100%; }
  .todo li.pop .mark { animation:pop .45s ease; }
  @keyframes pop { 40% { transform:scale(1.3) } }
  /* clipboard panel */
  .clip { border-top:1px solid var(--line); padding:10px 12px; display:none; gap:8px; flex-direction:column; }
  .clip.open { display:flex; }
  .clip textarea { width:100%; box-sizing:border-box; min-height:64px; resize:vertical; background:#111; color:var(--fg);
    border:1px solid #333; border-radius:8px; padding:8px; font:12px ui-monospace, monospace; }
  .clip .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .clip .hint { color:var(--dim); font-size:12px; flex:1; min-width:140px; }
  #cliphole { position:fixed; left:-9999px; top:0; width:10px; height:10px; opacity:0; }
  /* held pointer while dragging */
  #ptr { transition:transform .12s ease; }
  #ptr.held { transform:translate(-3px,-2px) scale(.82); }
  .grab { position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%;
    border:2px solid var(--warn); background:rgba(245,165,36,.18); pointer-events:none; z-index:2;
    animation:grab 1s ease-in-out infinite; }
  @keyframes grab { 50% { transform:scale(1.25); opacity:.6 } }
  /* goal line */
  .goal { display:flex; gap:8px; align-items:flex-start; margin:0 0 8px; padding:7px 10px; border-radius:8px;
    background:#151a22; border:1px solid #223049; color:var(--fg); line-height:1.35;
    transition:background .5s, border-color .5s; }
  .goal.hidden { display:none; }
  .goal .flag { flex:none; color:var(--accent); transition:color .5s, transform .5s; }
  .goal.met { background:#12201a; border-color:#1f5134; }
  .goal.met .flag { color:var(--done); transform:rotate(-12deg) scale(1.15); }
  .goal.met .gtext::after { content:"  — goal met"; color:var(--done); font-weight:600; animation:slidein .5s both; }
  /* ---- placeholder while the desktop is not up yet / frozen ---- */
  .ph { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 30% 20%, #1d2533 0%, #111419 55%, #0b0c0f 100%);
    transition:opacity .5s ease; overflow:hidden; }
  .ph.gone { opacity:0; pointer-events:none; }
  .ph .glow { position:absolute; width:60%; aspect-ratio:1; border-radius:50%; filter:blur(60px); opacity:.35;
    background:conic-gradient(from 0deg, #4f8cff, #7a5cff, #2ec5b6, #4f8cff); animation:drift 14s linear infinite; }
  @keyframes drift { from { transform:rotate(0deg) translate(10%) rotate(0deg) } to { transform:rotate(360deg) translate(10%) rotate(-360deg) } }
  .win { position:relative; width:58%; aspect-ratio:16/10; border-radius:10px; background:#161a21;
    border:1px solid #2a3140; box-shadow:0 20px 60px rgba(0,0,0,.5); overflow:hidden;
    animation:winin .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes winin { from { transform:translateY(14px) scale(.96); opacity:0 } to { transform:none; opacity:1 } }
  .win .tb { height:12%; display:flex; align-items:center; gap:6px; padding:0 4%; background:#1d2230; border-bottom:1px solid #2a3140; }
  .win .tb i { width:7px; height:7px; border-radius:50%; background:#3a4254; }
  .win .tb b { flex:1; height:34%; margin-left:6%; border-radius:6px; background:#262d3c; }
  .win .body { padding:6% 7%; display:flex; flex-direction:column; gap:9%; height:88%; box-sizing:border-box; }
  .win .ln { height:7%; border-radius:4px; background:linear-gradient(90deg, #232a38 0%, #33405a 50%, #232a38 100%);
    background-size:200% 100%; animation:shim 1.6s ease-in-out infinite; }
  .win .ln:nth-child(2) { width:82%; animation-delay:.15s } .win .ln:nth-child(3) { width:64%; animation-delay:.3s }
  .win .ln:nth-child(4) { width:90%; animation-delay:.45s } .win .ln:nth-child(5) { width:48%; animation-delay:.6s }
  @keyframes shim { 0% { background-position:100% 0 } 100% { background-position:-100% 0 } }
  .ph .cur { position:absolute; left:50%; top:55%; width:18px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
    animation:wander 6s ease-in-out infinite; }
  @keyframes wander { 0%,100% { transform:translate(-40px,10px) } 30% { transform:translate(60px,-30px) }
    60% { transform:translate(10px,40px) } 80% { transform:translate(-70px,-10px) } }
  .ph .label { position:absolute; bottom:9%; left:0; right:0; text-align:center; color:#c9d3e6; font-size:14px;
    letter-spacing:.02em; }
  .ph .label small { display:block; color:#7d889c; font-size:12px; margin-top:4px; }
  .ph .dots::after { content:''; animation:dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content:'' } 25% { content:'.' } 50% { content:'..' } 75% { content:'...' } }
  /* frozen */
  .ph.frozen { background:radial-gradient(120% 90% at 50% 30%, #1a2a3a 0%, #0e1620 60%, #090d12 100%); }
  .ph.frozen .glow { background:conic-gradient(from 0deg, #7fd3ff, #b9e8ff, #6aa8ff, #7fd3ff); opacity:.25 }
  .ph.frozen .win { filter:saturate(.3) brightness(.8); animation:none; }
  .ph.frozen .ln, .ph.frozen .cur { animation:none; }
  .ph .ice { display:none; position:absolute; font-size:44px; animation:float 3s ease-in-out infinite; }
  .ph.frozen .ice { display:block; }
  @keyframes float { 50% { transform:translateY(-8px) } }
  .ph .resume { display:none; margin-top:10px; }
  .ph.frozen .resume { display:inline-block; }
</style>
</head>
<body>
<div class="frame">
  <div class="bar">
    <span id="dot" class="dot"></span>
    <span id="caption" class="caption">Connecting…</span>
    <button id="clipbtn" title="Clipboard: paste into / copy from the desktop">📋</button>
    <button id="take">Take control</button>
    <button id="full" title="Full screen">⤢</button>
  </div>
  <div id="screen" class="screen locked">
    <div id="msg" class="msg">Connecting to the sandbox desktop…</div>
    <div id="ph" class="ph">
      <div class="glow"></div>
      <div class="win"><div class="tb"><i></i><i></i><i></i><b></b></div>
        <div class="body"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
      <svg class="cur" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.5 14 L10.5 20.5 L13 19.4 L10.1 13 L16 13 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <div class="ice">❄️</div>
      <div class="label"><span id="phtext" class="dots">Getting a desktop ready</span>
        <small id="phsub">The agent is planning - the browser opens when it starts working.</small>
        <button id="resume" class="resume primary">Resume desktop</button></div>
    </div>
    <div id="vnc"></div>
    <svg id="ptr" class="hide" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.5 14 L10.5 20.5 L13 19.4 L10.1 13 L16 13 Z"
      fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <div id="toast" class="toast"></div>
  </div>
  <div id="clip" class="clip">
    <textarea id="cliptext" placeholder="Paste text here, then Send to desktop. Text copied on the desktop shows up here too."></textarea>
    <div class="row">
      <span id="cliphint" class="hint">Tip: with control, Ctrl/⌘+V pastes and Ctrl+C on the desktop copies to your clipboard.</span>
      <button id="clipcopy">Copy to my clipboard</button>
      <button id="clipsend" class="primary">Send to desktop</button>
    </div>
  </div>
  <textarea id="cliphole" aria-hidden="true" tabindex="-1"></textarea>
  <div id="todo" class="todo empty">
    <div class="todo-head"><span>Plan</span><span id="todo-count" class="count"></span></div>
    <div id="goal" class="goal hidden"><span class="flag">⚑</span><span id="goal-text" class="gtext"></span></div>
    <div class="progress"><i id="todo-bar"></i></div>
    <ol id="todo-list"></ol>
  </div>
</div>
<script type="module">
import RFB from './novnc/core/rfb.js';
import KeyTable from './novnc/core/input/keysym.js';

const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const sid = params.get('s') || '';   // this chat's own desktop session
const q = (s) => document.querySelector(s);
const qs = () => `t=${encodeURIComponent(token)}&s=${encodeURIComponent(sid)}`;
const screenEl = q('#screen'), ptr = q('#ptr'), dot = q('#dot'), cap = q('#caption'), take = q('#take');
let userControl = false, busy = false, rfb = null, fb = { w: 1280, h: 800 };
let pos = { x: 640, y: 400 }, anim = null, toastTimer = null;

const postHeight = () => parent.postMessage({ type: 'iframe:height',
  height: document.documentElement.scrollHeight }, '*');
new ResizeObserver(postHeight).observe(document.body);

function wsUrl() {
  const u = new URL('websockify', location.href);
  u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
  u.searchParams.set('t', token);
  u.searchParams.set('s', sid);
  return u.href;
}

function connect() {
  rfb = new RFB(q('#vnc'), wsUrl(), { wsProtocols: ['binary'] });
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  // Never noVNC's viewOnly: it also blocks the (lazy, extended) clipboard exchange in both directions.
  // Agent mode is enforced by the viewer instead: no pointer events on the screen, keyboard filtered below.
  rfb.viewOnly = false;
  rfb.addEventListener('connect', () => { q('#msg').style.display = 'none'; vncUp = true; updatePh(); place(); });
  rfb.addEventListener('clipboard', (e) => onDesktopClipboard(e.detail.text));
  rfb.addEventListener('disconnect', () => {
    vncUp = false; updatePh();              // the placeholder covers the gap (not started / frozen / restarting)
    q('#msg').style.display = 'none';
    setTimeout(connect, isFrozen ? 5000 : 2500);
  });
}

// Map a framebuffer coordinate to a point inside #screen, following noVNC's scaling.
function toScreen(x, y) {
  const c = q('#vnc canvas');
  if (!c) return null;
  const r = c.getBoundingClientRect(), s = screenEl.getBoundingClientRect();
  fb = { w: c.width || fb.w, h: c.height || fb.h };
  return { left: r.left - s.left + x * r.width / fb.w, top: r.top - s.top + y * r.height / fb.h };
}
function place() {
  const p = toScreen(pos.x, pos.y);
  if (p) ptr.style.left = p.left + 'px', ptr.style.top = p.top + 'px';
  const g = document.getElementById('grab');
  if (p && g) g.style.left = p.left + 'px', g.style.top = p.top + 'px';
}
new ResizeObserver(place).observe(screenEl);

function moveTo(x, y, ms) {
  cancelAnimationFrame(anim);
  const from = { ...pos }, t0 = performance.now();
  const step = (t) => {
    let f = Math.min(1, (t - t0) / Math.max(ms, 1));
    f = f * f * (3 - 2 * f);
    pos = { x: from.x + (x - from.x) * f, y: from.y + (y - from.y) * f };
    place();
    if (f < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function ripple(x, y) {
  const p = toScreen(x, y);
  if (!p) return;
  const d = document.createElement('div');
  d.className = 'ripple'; d.style.left = p.left + 'px'; d.style.top = p.top + 'px';
  screenEl.appendChild(d); setTimeout(() => d.remove(), 600);
}
function toast(text) {
  const t = q('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function render(caption) {
  if (caption !== undefined) cap.innerHTML = caption ? escape(caption) : '';
  if (userControl) {
    dot.className = 'dot user';
    cap.innerHTML = '<b>You have control.</b> The agent is paused.';
    take.textContent = 'Hand back to agent'; take.className = 'primary';
  } else {
    dot.className = busy ? 'dot busy' : 'dot';
    if (!cap.textContent) cap.textContent = busy ? 'Agent working…' : 'Agent idle';
    take.textContent = 'Take control'; take.className = '';
  }
  screenEl.classList.toggle('locked', !userControl);
  ptr.classList.toggle('hide', userControl);
  if (rfb) { rfb.viewOnly = false; rfb.showDotCursor = userControl; if (userControl) rfb.focus(); else rfb.blur(); }
}
const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

take.onclick = async () => {
  const want = !userControl;
  const r = await fetch(`api/control?${qs()}`, { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: want }) });
  if (r.ok) { userControl = (await r.json()).user_control; render(); }
};
q('#full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : screenEl.requestFullscreen?.());

// ---- plan / todo: update rows in place so CSS transitions animate each change ----
const MARK = '<svg viewBox="0 0 16 16"><circle class="ring" cx="8" cy="8" r="7"/>' +
  '<circle class="spin" cx="8" cy="8" r="7"/><path class="tick" d="M4.6 8.3 L7 10.6 L11.4 5.8"/></svg>';
function renderGoal(goal) {
  const g = q('#goal');
  g.classList.toggle('hidden', !goal || !goal.text);
  if (!goal || !goal.text) return;
  if (q('#goal-text').textContent !== goal.text) q('#goal-text').textContent = goal.text;
  g.classList.toggle('met', !!goal.met);
}
function renderTodo(items, goal) {
  items = items || [];
  renderGoal(goal);
  const list = q('#todo-list'), box = q('#todo');
  box.classList.toggle('empty', items.length === 0 && !(goal && goal.text));
  const rows = [...list.children];
  items.forEach((it, i) => {
    let li = rows[i];
    if (!li || li.dataset.text !== it.text) {
      const fresh = document.createElement('li');
      fresh.dataset.text = it.text;
      fresh.style.animationDelay = (i * 60) + 'ms';
      fresh.innerHTML = `<span class="mark">${MARK}</span><span class="label"></span>`;
      fresh.querySelector('.label').textContent = it.text;
      if (li) list.replaceChild(fresh, li); else list.appendChild(fresh);
      li = fresh;
    }
    const was = li.dataset.status;
    if (was !== it.status) {
      li.classList.remove('pending', 'active', 'done');
      li.classList.add(it.status);
      if (it.status === 'done' && was) { li.classList.remove('pop'); void li.offsetWidth; li.classList.add('pop'); }
      li.dataset.status = it.status;
    }
  });
  rows.slice(items.length).forEach((li) => li.remove());
  const done = items.filter((it) => it.status === 'done').length;
  q('#todo-count').textContent = items.length ? `${done} / ${items.length}` : '';
  q('#todo-bar').style.width = items.length ? (100 * done / items.length) + '%' : '0';
}

// ---- placeholder / frozen state ----
let browserReady = false, vncUp = false, isFrozen = false;
function updatePh() {
  const ph = q('#ph');
  ph.classList.toggle('frozen', isFrozen);
  const show = isFrozen || !browserReady || !vncUp;
  ph.classList.toggle('gone', !show);
  if (isFrozen) {
    q('#phtext').classList.remove('dots');
    q('#phtext').textContent = 'Session frozen on disk';
    q('#phsub').textContent = 'Its tabs, logins and plan are saved. Resume brings the desktop back.';
  } else if (q('#phtext').textContent === 'Session frozen on disk') {
    q('#phtext').classList.add('dots'); q('#phtext').textContent = 'Starting the desktop';
    q('#phsub').textContent = 'Opening the browser with your saved tabs.';
  }
}
function phase(text) {
  if (!text || isFrozen) return;
  q('#phtext').classList.add('dots');
  q('#phtext').textContent = text.replace(/[….]+$/, '');
}
q('#resume').onclick = async () => {
  q('#resume').disabled = true;
  isFrozen = false; phase('Starting the desktop'); updatePh();
  await fetch(`api/thaw?${qs()}`, { method: 'POST' }).catch(() => {});
  q('#resume').disabled = false;
};

// ---- clipboard ----
// The viewer lives in Open WebUI's sandboxed iframe over http, so navigator.clipboard is unavailable.
// Paste: catch Ctrl/Cmd+V before noVNC swallows it, let the browser paste into a hidden textarea, then
// hand the text to the desktop's clipboard and press Ctrl+V there. Copy: when the desktop's clipboard
// changes right after the user pressed Ctrl+C (a user gesture), execCommand('copy') is still allowed.
let lastCopyKey = 0;
function sendToDesktop(text, pressPaste = true) {
  if (!rfb || !text) return;
  rfb.clipboardPasteFrom(text);
  if (pressPaste) setTimeout(() => {
    rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', true);
    rfb.sendKey(KeyTable.XK_v, 'KeyV');
    rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', false);
  }, 60);
  toast('📋 pasted ' + (text.length > 40 ? text.slice(0, 40) + '…' : text));
}
function copyLocal(text) {
  const hole = q('#cliphole');
  hole.value = text; hole.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  if (rfb && userControl) rfb.focus();
  return ok;
}
function onDesktopClipboard(text) {
  q('#cliptext').value = text;
  if (Date.now() - lastCopyKey < 4000 && copyLocal(text)) toast('📋 copied to your clipboard');
  else q('#cliphint').textContent = 'The desktop copied text - press "Copy to my clipboard".';
}
// Agent mode: no keystrokes reach the desktop (the screen already ignores the mouse).
['keydown', 'keyup', 'keypress'].forEach((t) => window.addEventListener(t, (e) => {
  if (!userControl && q('#vnc').contains(document.activeElement)) { e.stopImmediatePropagation(); e.preventDefault(); }
}, true));
window.addEventListener('keydown', (e) => {
  if (!userControl || !(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'c' || k === 'x') lastCopyKey = Date.now();
  if (k === 'v' && document.activeElement !== q('#cliptext')) {
    const hole = q('#cliphole');
    hole.value = ''; hole.focus();          // the browser pastes here instead of into noVNC
    e.stopImmediatePropagation();           // noVNC must not see (and preventDefault) this key
  }
}, true);
q('#cliphole').addEventListener('paste', (e) => {
  const text = e.clipboardData && e.clipboardData.getData('text/plain');
  e.preventDefault();
  if (text) sendToDesktop(text);
  if (rfb) rfb.focus();
});
q('#clipbtn').onclick = () => { q('#clip').classList.toggle('open'); postHeight(); };
q('#clipsend').onclick = () => {
  const text = q('#cliptext').value;
  if (!text) return;
  // Only type it into the page when the user drives; otherwise just put it on the desktop's clipboard.
  sendToDesktop(text, userControl);
  if (!userControl) toast('📋 on the desktop clipboard (take control and press Ctrl+V to paste)');
};
q('#clipcopy').onclick = () => {
  const ok = copyLocal(q('#cliptext').value);
  toast(ok ? '📋 copied to your clipboard' : 'Select the text and copy it by hand');
  if (!ok) { q('#cliptext').focus(); q('#cliptext').select(); }
};

function listen() {
  const es = new EventSource(`api/events?${qs()}`);
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === 'state') {
      userControl = e.user_control; pos = { x: e.pointer[0], y: e.pointer[1] }; place();
      busy = !!e.caption; render(e.caption); renderTodo(e.todo, e.goal);
      if ('browser_ready' in e) browserReady = !!e.browser_ready;
      if ('frozen' in e) isFrozen = !!e.frozen;
      updatePh();
    } else if (e.type === 'caption') { busy = e.busy; render(e.text); if (!browserReady) phase(e.text); }
    else if (e.type === 'ready') { browserReady = !!e.browser_ready; updatePh(); }
    else if (e.type === 'phase') phase(e.text);
    else if (e.type === 'move') { ptr.classList.toggle('hide', userControl); moveTo(e.x, e.y, e.ms); }
    else if (e.type === 'click') ripple(e.x, e.y);
    else if (e.type === 'todo') renderTodo(e.items, e.goal);
    else if (e.type === 'press') {
      ptr.classList.add('held');
      const p = toScreen(e.x, e.y);
      if (p) { const g = document.createElement('div'); g.className = 'grab'; g.id = 'grab';
        g.style.left = p.left + 'px'; g.style.top = p.top + 'px'; screenEl.appendChild(g); }
      toast('✥ dragging');
    } else if (e.type === 'release') { ptr.classList.remove('held'); q('#grab')?.remove(); ripple(e.x, e.y); }
    else if (e.type === 'typing') toast('⌨ ' + e.text);
    else if (e.type === 'key') toast('⌨ ' + e.keys);
    else if (e.type === 'scroll') toast(e.direction === 'up' ? '↑ scroll' : '↓ scroll');
  };
  es.onerror = () => { es.close(); setTimeout(listen, 2000); };
}

render('');
connect();
listen();
postHeight();
</script>
</body>
</html>
